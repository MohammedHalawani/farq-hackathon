[project]
name = "uni-scheduler"
version = "0.1.0"
description = "Smart university scheduling agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "ollama>=0.6.2",
    "openpyxl>=3.1.5",
    "ortools>=9.15.6755",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
